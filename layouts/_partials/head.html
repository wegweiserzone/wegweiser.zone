<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.description }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<link rel="canonical" href="{{ .Permalink }}" />
{{/* Set by the deploy so it can verify the new build went live. */}}
{{ with getenv "SITE_COMMIT" }}<meta name="build" content="{{ . }}" />{{ end }}
{{ with .Params.robots }}<meta name="robots" content="{{ . }}" />{{ end }}

<meta property="og:type" content="website" />
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}" />
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:site_name" content="Wegweiser" />
<meta property="og:image" content="{{ "img/og.png" | absURL }}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/barlow-latin-400-normal.woff2" />
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/barlow-condensed-latin-600-normal.woff2" />

{{ with resources.Get "css/main.css" }}
  {{ $css := . | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}" />
{{ end }}

<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
