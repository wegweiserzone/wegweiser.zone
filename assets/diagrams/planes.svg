<svg viewBox="0 0 660 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="pl-tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--ink-mute)"/>
    </marker>
    <marker id="pl-tip-signal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--signal)"/>
    </marker>
  </defs>

  <rect x="196" y="16" width="446" height="128" rx="5" fill="none" stroke="var(--line)" stroke-width="1.5"/>
  <text class="d-plane" x="419" y="38" text-anchor="middle">control plane</text>
  <text class="d-label" x="16" y="62" text-anchor="start">HTTP / JSON</text>
  <text class="d-label" x="16" y="80" text-anchor="start">GUI · CLI</text>
  <line x1="120" y1="72" x2="188" y2="72" stroke="var(--ink-mute)" stroke-width="1.5" marker-end="url(#pl-tip)"/>
  <text class="d-step" x="222" y="78" text-anchor="start">api</text>
  <line x1="256" y1="72" x2="292" y2="72" stroke="var(--ink-mute)" stroke-width="1.5" marker-end="url(#pl-tip)"/>
  <text class="d-step" x="302" y="78" text-anchor="start">zone (validate, reverse)</text>
  <line x1="470" y1="72" x2="506" y2="72" stroke="var(--ink-mute)" stroke-width="1.5" marker-end="url(#pl-tip)"/>
  <text class="d-step" x="516" y="78" text-anchor="start">journal</text>
  <path d="M540 84 L540 112" stroke="var(--ink-mute)" stroke-width="1.5" marker-end="url(#pl-tip)"/>
  <text class="d-step" x="516" y="130" text-anchor="start">store</text>

  <path d="M540 152 L540 186" stroke="var(--signal)" stroke-width="1.5" marker-end="url(#pl-tip-signal)"/>
  <text class="d-label d-label--signal" x="528" y="174" text-anchor="end">rebuild, swap by pointer</text>

  <rect x="196" y="194" width="446" height="120" rx="5" fill="none" stroke="var(--signal)" stroke-width="1.5"/>
  <text class="d-plane d-plane--signal" x="419" y="216" text-anchor="middle">data plane</text>
  <text class="d-step" x="222" y="258" text-anchor="start">snapshot (radix trie, immutable)</text>
  <text class="d-label" x="222" y="284" text-anchor="start">a write never blocks a query in flight</text>

  <text class="d-label" x="16" y="252" text-anchor="start">DNS UDP / TCP</text>
  <line x1="120" y1="246" x2="188" y2="246" stroke="var(--ink-mute)" stroke-width="1.5" marker-end="url(#pl-tip)"/>
</svg>
